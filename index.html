<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monumento - Proyecto en Curso</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-family: 'Montserrat', sans-serif;
            color: #6D7F62; /* Verde musgo */
            
            /* Veladura del 88% sobre tu fotografía */
            background-image: linear-gradient(rgba(244, 244, 240, 0.88), rgba(244, 244, 240, 0.88)), url('image.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            border: 1px solid rgba(109, 127, 98, 0.3);
            padding: 40px 30px;
            background: rgba(244, 244, 240, 0.6);
            backdrop-filter: blur(4px); /* Ligero desenfoque para dar efecto cristal */
            max-width: 90%;
            width: 400px;
        }

        h1 {
            font-size: 1.2rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 600;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 0.75rem;
            letter-spacing: 2px;
            font-style: italic;
            margin-bottom: 40px;
        }

        /* Estilos del Cronómetro */
        .timer-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-number {
            font-size: 2.5rem;
            font-weight: 300;
            line-height: 1;
            margin-bottom: 5px;
        }

        .time-label {
            font-size: 0.65rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
        }

        .coordinates {
            font-size: 0.7rem;
            letter-spacing: 2px;
            border-top: 1px solid rgba(109, 127, 98, 0.3);
            padding-top: 20px;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Acta de Inicio</h1>
        <div class="subtitle">Fase de cimentación activa</div>

        <!-- Cronómetro -->
        <div class="timer-grid" id="chronometer">
            <div class="time-box">
                <div class="time-number" id="days">00</div>
                <div class="time-label">Días</div>
            </div>
            <div class="time-box">
                <div class="time-number" id="hours">00</div>
                <div class="time-label">Horas</div>
            </div>
            <div class="time-box">
                <div class="time-number" id="minutes">00</div>
                <div class="time-label">Min.</div>
            </div>
            <div class="time-box" style="grid-column: 2;">
                <div class="time-number" id="seconds">00</div>
                <div class="time-label">Seg.</div>
            </div>
        </div>

        <div class="coordinates">
            COORDENADAS DE CIMENTACIÓN<br>
            <span style="font-weight: 600; margin-top: 5px; display: inline-block;">JERICÓ, ANTIOQUIA</span>
            <!-- Aquí podrás poner las coordenadas exactas de GPS luego -->
        </div>
    </div>

    <script>
        // CONFIGURACIÓN DE LA FECHA DE LA PROPUESTA
        // Formato: Año, Mes (0-11, donde 0 es Enero y 9 es Octubre), Día, Hora, Minuto, Segundo
        // Ejemplo: 18 de Octubre de 2026 a las 17:30 (5:30 PM)
        const proposalDate = new Date(2026, 9, 11, 19, 51, 0).getTime();

        function updateChronometer() {
            const now = new Date().getTime();
            const difference = now - proposalDate;

            // Si la fecha actual es anterior a la propuesta, el cronómetro marca ceros
            if (difference < 0) {
                return; 
            }

            // Cálculos matemáticos de tiempo
            const days = Math.floor(difference / (1000 * 60 * 60 * 24));
            const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((difference % (1000 * 60)) / 1000);

            // Actualización del HTML añadiendo ceros a la izquierda si es menor a 10
            document.getElementById("days").innerText = days.toString().padStart(2, '0');
            document.getElementById("hours").innerText = hours.toString().padStart(2, '0');
            document.getElementById("minutes").innerText = minutes.toString().padStart(2, '0');
            document.getElementById("seconds").innerText = seconds.toString().padStart(2, '0');
        }

        // Actualizar cada segundo
        setInterval(updateChronometer, 1000);
        updateChronometer(); // Llamada inicial
    </script>

</body>
</html>
