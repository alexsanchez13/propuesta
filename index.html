<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para ti</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --sage-green: #5D6D51;
            --moss-green: #6D7F62;
            --cream: #F4F4F0;
            --dark-text: #2C3327;
        }
        body {
            margin: 0; padding: 20px;
            font-family: 'Montserrat', sans-serif;
            color: var(--dark-text);
            /* Veladura de fondo reducida al 70% para que la fotografía se aprecie mucho más */
            background-image: linear-gradient(rgba(244, 244, 240, 0.7), rgba(244, 244, 240, 0.7)), url('image.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .arch-container {
            /* Contenedor con fondo blanco ligeramente más opaco para asegurar la lectura con el fondo más visible */
            background: rgba(255, 255, 255, 0.98);
            max-width: 400px; width: 100%;
            border-radius: 140px 140px 10px 10px;
            padding: 30px 30px 40px;
            box-shadow: 0 15px 35px rgba(93, 109, 81, 0.18);
            text-align: center;
            border: 1px solid rgba(93, 109, 81, 0.25);
            position: relative;
        }
        .azulejo-ornament {
            width: 55px; height: 55px;
            margin: 0 auto 20px auto;
            display: block;
        }
        h1 { 
            font-weight: 700; 
            color: var(--moss-green); 
            font-size: 1.5rem; 
            margin-bottom: 20px;
            text-shadow: 0 1px 1px rgba(0,0,0,0.05);
        }
        p { font-weight: 300; font-size: 1rem; line-height: 1.6; margin-bottom: 20px; }
        
        .timer-box {
            font-size: 0.95rem; font-weight: 700; color: var(--moss-green);
            background: rgba(93, 109, 81, 0.12); padding: 20px;
            border-radius: 15px; margin-top: 20px;
            line-height: 1.8;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.02);
        }
        
        .exact-date {
            font-size: 0.75rem; color: var(--sage-green);
            text-align: right; margin-top: 15px; margin-bottom: 0;
            font-weight: 400; font-style: italic;
        }
    </style>
</head>
<body>

<div class="arch-container">
    
    <!-- Detalle Arquitectónico Fijo -->
    <svg class="azulejo-ornament" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <path d="M50 2 C55 38 62 45 98 50 C62 55 55 62 50 98 C45 62 38 55 2 50 C38 45 45 38 50 2 Z" fill="none" stroke="#6D7F62" stroke-width="2.5"/>
        <path d="M50 16 L58 42 L84 50 L58 58 L50 84 L42 58 L16 50 L42 42 Z" fill="#5D6D51" opacity="0.9"/>
        <circle cx="50" cy="50" r="9" fill="#F4F4F0" stroke="#6D7F62" stroke-width="2"/>
        <circle cx="50" cy="50" r="3.5" fill="#C81D25"/>
    </svg>

    <!-- VISTA ÚNICA: El Cronómetro Permanente -->
    <div id="timer-section">
        <h1>Nuestro Tiempo</h1>
        <p id="location-text" style="font-size: 0.9rem; color: var(--sage-green); font-style: italic;">Aceptaste comenzar esta historia en Jericó, Antioquia.</p>
        <p>La estructura se mantiene firme.</p>
        <div class="timer-box" id="time-display">Calculando...</div>
        <p class="exact-date" id="date-display"></p>
    </div>
</div>

<script>
    // FASE 2: FIJAR LA FECHA EXACTA AQUÍ
    // Formato: "AAAA-MM-DDTHH:MM:SS" (Año, Mes, Día, T, Hora en 24h, Minuto, Segundo)
    let startDate = new Date("2026-10-11T19:51:00").getTime();

    function formatExactDate(timestamp) {
        let d = new Date(timestamp);
        let dateString = d.toLocaleDateString('es-CO'); 
        let timeString = d.toLocaleTimeString('es-CO', { hour: '2-digit', minute: '2-digit' });
        document.getElementById('date-display').innerText = "Desde: " + dateString + " - " + timeString;
    }

    function updateTimer() {
        let now = new Date().getTime();
        let distance = now - startDate;

        // Cálculos detallados
        let years = Math.floor(distance / (1000 * 60 * 60 * 24 * 365.25));
        let months = Math.floor((distance % (1000 * 60 * 60 * 24 * 365.25)) / (1000 * 60 * 60 * 24 * 30.4375));
        let days = Math.floor((distance % (1000 * 60 * 60 * 24 * 30.4375)) / (1000 * 60 * 60 * 24));
        let hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
        let seconds = Math.floor((distance % (1000 * 60)) / 1000);

        document.getElementById("time-display").innerHTML = 
            years + " años, " + months + " meses, " + days + " días, <br>" + 
            hours + " horas, " + minutes + " minutos, " + seconds + " seg";
    }

    // Arrancar inmediatamente
    formatExactDate(startDate);
    setInterval(updateTimer, 1000);
    updateTimer();
</script>
</body>
</html>
