<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Restringido</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background-color: #F4F4F0; /* Crema base */
            font-family: 'Montserrat', sans-serif;
            color: #6D7F62; /* Verde musgo */
            text-align: center;
            padding: 20px;
        }
        .icon {
            width: 50px;
            height: 50px;
            border: 2px solid #6D7F62;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        .icon svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: #6D7F62;
            stroke-width: 2;
        }
        h1 {
            font-size: 1.2rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }
        p {
            font-size: 0.9rem;
            letter-spacing: 1px;
            opacity: 0.8;
            max-width: 300px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="icon">
        <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
    </div>

    <h1>Zona de Obra</h1>
    <p>Proyecto en fase de cimentación.<br>Acceso restringido hasta la firma del Acta de Inicio.</p>

</body>
</html>
